apiVersion: apps/v1
kind: Deployment

metadata:
  name: notification-service
  namespace: floodwatch

spec:
  replicas: 1

  selector:
    matchLabels:
      app: notification-service

  template:
    metadata:
      labels:
        app: notification-service

    spec:
      containers:
        - name: notification-service
          image: floodwatch-notification-service:latest

          env:
            - name: KAFKA_BROKER
              value: "kafka:9092"