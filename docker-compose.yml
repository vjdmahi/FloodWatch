services:

  sensor-service:
    build:
      context: ./sensor-service
    container_name: floodwatch-sensor-service
    ports:
      - "5003:5001"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017/floodwatch

  alert-service:
    build:
      context: ./alert-service
    container_name: floodwatch-alert-service
    ports:
      - "5004:5004"
    depends_on:
      - mongodb
      - kafka
  
  user-service:
    build:
      context: ./user-service
    container_name: floodwatch-user-service
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      MONGO_URI: mongodb://mongodb:27017/floodwatch
      JWT_SECRET: floodwatch-development-secret
    depends_on:
      mongodb:
        condition: service_healthy

  api-gateway:
    build:
      context: ./api-gateway
    container_name: floodwatch-api-gateway
    ports:
      - "5000:5000"
    depends_on:
      - backend
      - sensor-service
      - alert-service
    environment:
       JWT_SECRET: floodwatch-development-secret
      

  mongodb:
    image: mongo:8.0
    container_name: floodwatch-mongodb
    ports:
      - "27017:27017"
    volumes:
      - floodwatch-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build:
      context: ./server 
    container_name: floodwatch-backend
    ports:
      - "5002:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/floodwatch
      KAFKA_BROKER: kafka:9092
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  sensor:
    build:
      context: ./sensor
    container_name: floodwatch-sensor
    depends_on:
      backend:
        condition: service_healthy
  
  frontend:
    build:
      context: ./client
    container_name: floodwatch-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.0.0
    container_name: floodwatch-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  notification-service:
    build:
      context: ./notification-service
    container_name: floodwatch-notification
    depends_on:
      - kafka

volumes:
  floodwatch-mongodb-data: